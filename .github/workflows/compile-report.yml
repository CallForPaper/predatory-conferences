name: Compile and Telemetry Report
on:
  push:
    branches: [ main ]
  pull_request:
    types: [closed]
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  compile_and_report:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install pyyaml

    - name: Compile JSON Targets
      run: |
        python scripts/compile_dist.py

    - name: Generate Statistics Report
      id: generate_report
      run: |
        # Call the existing stats generator to display active data metrics
        # We can dynamically compile and retrieve metrics
        python -c '
        import yaml, json, glob
        orgs = len(glob.glob("organizers/*.yaml")) + len(glob.glob("organizers/*.yml"))
        confs = len(glob.glob("conferences/**/*.yaml", recursive=True)) + len(glob.glob("conferences/**/*.yml", recursive=True))
        
        # Load statuses
        statuses = {}
        for f in glob.glob("organizers/*.yaml") + glob.glob("conferences/**/*.yaml", recursive=True):
            try:
                with open(f) as y:
                    d = yaml.safe_load(y)
                    st = d.get("status", "unknown")
                    statuses[st] = statuses.get(st, 0) + 1
            except:
                pass
                
        print("### 📊 Dataset Telemetry Metrics Summary")
        print(f"- **Total Organizers**: {orgs}")
        print(f"- **Total Conferences**: {confs}")
        print("- **Statuses breakdown**:")
        for k, v in statuses.items():
            print(f"  - `{k}`: {v}")
        ' > stats_summary.txt
        cat stats_summary.txt
        # Pass file to output env
        {
          echo "REPORT_CONTENT<<EOF"
          cat stats_summary.txt
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Comment Stats Summary on PR (Only if PR is merged)
      if: github.event.pull_request.merged == true
      uses: actions/github-script@v7
      with:
        script: |
          const report = `${{ steps.generate_report.outputs.REPORT_CONTENT }}`;
          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: report
          });

    - name: Commit Compiled Distribution Targets
      if: github.event_name == 'push'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add dist/*.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-compile distribution files [skip ci]" && git push)
