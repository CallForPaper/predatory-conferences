    id: rf-97
    type: same_day_same_venue_stacking
    description: 'Confirmed via the organizer''s own "Related Conferences" cross-links: at least 6 independently-branded, independently-numbered series (103rd Social Media Management, 107th African Economy and Culture, 107th Strategic Management and Planning, 108th Advertising and Marketing Communications, 108th E-commerce and Internet Marketing, 112th African Business and Technology) are all scheduled for the same Sept 4–6, 2026 window at George Brown College – Residence & Conference Centre, Toronto. The high, non-matching ordinal numbers (103rd–112th) imply each series has run 100+ prior independent editions, an implausible claim alongside dozens of them converging on the identical venue and dates.'
