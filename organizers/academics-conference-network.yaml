    type: same_day_same_venue_stacking
    description: |-
      More than 15 events are listed at the exact same venue—NH Bypass, Venpalavattom, Anayara, 695029, Trivandrum—on 21 August 2026, followed by the same 15+ events supposedly taking place the very next day at Hotel Madhav International in Pune.

      This doesn’t resemble conventional venue stacking. It looks more like a city × title matrix, with little to no plausible logistical connection between the event listings and the physical venues.
