notes: |-
  India-based operation (contact +91 7077656338) branding itself as an "American Society".
  Runs large numbers of near-identical titled conferences on the same calendar date across many cities and unrelated subject domains. Closely resembles the operational pattern of ISERD (iserd.co) and other Bhubaneswar-linked conference mills.