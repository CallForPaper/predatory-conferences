  -
    id: rf-106
    type: other
    description: ' Industrial-scale production of conferences: dozens of events listed across many months and cities (London, Phuket, Bangkok, Tokyo, Cannes, Kyoto, New York, Dubai, Madrid, Bali, etc.) covering broad and often unrelated disciplines. Pattern of mass simultaneous or near-identical template events is characteristic of predatory conference mills.'
    first_observed: '2026-09-07'
    last_confirmed: '2026-09-07'
    status: active
    evidence_refs:
      - ev-141
      - ev-142
  -
    id: rf-109
    type: shared_predatory_network
    description: 'ISERD and ASERD (aserd.org) show a near-identical mass same-day, multi-topic conference pattern and are frequently discussed together in academic forums as part of the same operational network. Both share a Bhubaneswar/Odisha, India base, a similar India-mobile contact pattern, and closely parallel naming conventions (ISERD / ASERD), consistent with common ownership or a shared template operation rather than two independently-run societies.'
    first_observed: '2026-09-07'
    last_confirmed: '2026-09-07'
    status: active
    evidence_refs:
      - ev-146
      - ev-147
  -
    id: rf-107
    type: generic_reused_content
    description: 'About / mission / welcome text and overall site structure are generic and reused across conference pages. Testimonials and highlight galleries appear templated.'
    first_observed: '2026-09-07'
    last_confirmed: '2026-09-07'
    status: active
    evidence_refs:
      - ev-143
  -
    id: rf-110
    type: other
    description: 'Community reports (ResearchGate threads dating back years) describe non-delivery of physical conferences after fee collection, conversion to virtual with minimal participation, and acceptance of papers without meaningful peer review. Caltech Questionable Conferences list and multiple independent academic warnings reference ISER / ISERD.'
    first_observed: '2026-09-07'
    last_confirmed: '2026-09-07'
    status: active
    evidence_refs:
      - ev-148
