notes: 'India-based operation headquartered in Bhubaneswar, Odisha (Khandagiri / Dharma Vihar). Contact numbers +91 8455026354. Runs large numbers of international conferences under the ISERD brand across Science, Engineering, Healthcare and Education in tourist cities worldwide. Closely linked in operational style, naming, and location to ASERD (aserd.org) and other Bhubaneswar conference mills. Longstanding community reports of non-existent or low-value events and fee collection.'
