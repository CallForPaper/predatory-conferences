notes: |-
  Aliases: WASET
  One of the most extensively documented predatory conference organizers and open-access publishers. Operates as a family business (Cemal Ardil and family, Turkey). Schedules hundreds to thousands of conferences per year, frequently with identical or near-identical titles to legitimate events. Recent scale example: 453 distinct conferences listed for Oslo on 26–27 June 2025; earlier peak of 2,280 conferences announced for a single day in Oslo in 2023. Acceptance is effectively automatic upon payment of the registration fee. Long-standing Beall’s List entry and subject of multiple investigative reports (ICIJ, Süddeutsche Zeitung, Newstapa, Khrono, etc.).