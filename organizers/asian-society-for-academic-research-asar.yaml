notes: 'India-based operation (Bhubaneswar / Odisha address: Plot no 30 / ITR Building, Dharma Vihar / Khandagiri). Runs large numbers of near-identical conferences on the same calendar dates across many cities. Shares physical address and operational pattern with related entities such as ARSSS. Contact via Indian mobiles (+91 8280047516, +91 9668907939) and Gmail.'
