red_flags:
  -
    id: rf-111
    type: other
    description: 'On a single date (08 Sep 2026) the site lists the same conference titles (e.g. International Conference on Toxicology and Clinical Toxicology – ICTCT, International Conference on Computing E-learning and Information Technology – ICCEIT, International Conference on Neuroscience and Psychiatry – ICNP) at multiple completely unrelated cities worldwide (Vienna, Tauranga, Cienfuegos, Cartagena, Gwangju, Denver, Nashville, Kopavogur, Roseau, Auckland, etc.). This industrial same-day multi-venue production of identical titles is a core predatory pattern.'
    first_observed: '2026-09-07'
    last_confirmed: '2026-09-07'
    status: active
    evidence_refs:
      - ev-150
      - ev-149
