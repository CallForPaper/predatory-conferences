    id: rf-112
    type: generic_reused_content
    description: 'About / mission text and overall page structure are heavily templated and reused across conference listings. Boilerplate language about providing a platform for scientists, researchers, engineers, doctors, etc. appears generic and non-specific.'
    first_observed: '2026-09-07'
    last_confirmed: '2026-09-07'
    status: active
    evidence_refs:
      - ev-151
  -
    id: rf-113
    type: shared_predatory_network
    description: 'India mobile contact pattern, mass same-day multi-city conference model, and generic operational style closely match other flagged India-based conference organizers such as ASERD (aserd.org) and ISERD (iserd.co).'
