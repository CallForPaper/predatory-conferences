red_flags:
  -
    id: rf-92
    type: same_day_same_venue_stacking
    description: 'Upcoming Conferences" page lists the same 5 conference titles (WCCCGW, WCSB, EMMSN, ICAIR, ICANFT) as occurring in 6+ different cities on the same calendar date, repeating daily for weeks into the future (e.g. 19 Aug alone lists WCCCGW Kenya, India,Saint Lucia, Icland, UK, Canada  ). Same WCCCGW listed for 27 Aug, 4th sept. Not venue stacking in the classic sense — a city x title matrix with no plausible logistics behind it.'
    first_observed: '2026-08-18'
    last_confirmed: '2026-08-18'
    status: active
    evidence_refs:
      - ev-119
      - ev-120
      - ev-121
  -
    id: rf-95
    type: false_indexing_claims
    description: 'Multiple conference listings (WCCCGW) carry an identical boilerplate notice: "This International conference is Associated with UGC Care listed and Scopus Indexed International journals." No specific journal title, ISSN, publisher, or Scopus Source ID is given anywhere, making the claim unverifiable against Scopus''s own source list. The same generic sentence is reused verbatim across unrelated cities and dates, consistent with the site''s broader templated-content pattern rather than a genuine, checkable indexing arrangement.'
    first_observed: '2026-08-18'
    last_confirmed: '2026-08-18'
    status: active
    evidence_refs:
      - ev-122
  -
    id: rf-93
    type: no_named_accrediting_body
    description: 'No verifiable registered legal entity or street address found anywhere on the site.'
    first_observed: '2026-08-18'
    last_confirmed: '2026-08-18'
    status: active
    evidence_refs:
      - ev-118
  -
    id: rf-94
    type: generic_reused_content
    description: 'Conference description/scope text is identical boilerplate reused verbatim across every city/date instance of a given title; only the city name and date change between listings.'
    first_observed: '2026-08-18'
    last_confirmed: '2026-08-18'
    status: active
    evidence_refs: []
