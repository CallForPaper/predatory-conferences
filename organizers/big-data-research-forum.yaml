red_flags:
  -
    id: rf-88
    type: same_day_same_venue_stacking
    description: |-
      Upcoming Conferences" page lists the same 5 conference titles
            (ICBSC, ICMLCG, ICBIoTML, ICBDS, ICBDCSI) as occurring in 30-40+
            different cities on the same calendar date, repeating daily for
            weeks into the future (e.g. 18 Aug alone lists ICBSC in Istanbul,
            Changsha, Singapore, Tokyo, San Diego, Boston, Bali, Dubai,
            London, Kuwait City, and more). Not venue stacking in the
            classic sense — a city x title matrix with no plausible
            logistics behind it.
    first_observed: '2026-08-16'
    last_confirmed: '2026-08-16'
    status: active
    evidence_refs:
      - ev-113
      - ev-106
      - ev-112
